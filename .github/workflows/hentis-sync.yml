name: Hentis Sync Plane upstream
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: hentis-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Hantking/plane-custom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hentis/custom-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge stable release preserving customizations
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python hentis/sync_upstream.py && git push origin HEAD:hentis/custom-fields
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title 'Plane upstream requer adaptação' --body "Conflito ou mudança incompatível. Nenhuma imagem aprovada será substituída. Logs https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
