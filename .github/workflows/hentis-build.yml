name: Hentis Validate and Build
on:
  push:
    branches: [hentis/custom-fields]
  workflow_dispatch:
  workflow_run:
    workflows: [Hentis Sync Plane upstream]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: hentis-images
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Hantking/plane-custom' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hentis/custom-fields
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend-test:
    needs: resolve
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: plane
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-test-key-only
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/plane
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install -r requirements/base.txt
        working-directory: apps/api
      - run: python manage.py test plane.custom_fields plane.ai plane.api.test_report_read --settings=plane.ai.test_settings --noinput && python manage.py makemigrations --check --dry-run
        working-directory: apps/api
  web-test:
    needs: [resolve, backend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plane/i18n exec tsx --test ../../hentis/tests/option-colors.test.ts ../../hentis/tests/selection-values.test.ts ../../hentis/tests/native-display.test.ts ../../hentis/tests/table-widths.test.ts ../../hentis/tests/plane-ai-writing.test.ts ../../hentis/tests/relative-dates.test.ts ../../hentis/tests/native-list.test.ts ../../hentis/tests/plane-ai-chat.test.ts ../../hentis/tests/plane-ai-markdown.test.mjs ../../hentis/tests/text-values.test.ts ../../hentis/tests/date-time-values.test.ts ../../hentis/tests/module-state-visibility.test.ts ../../hentis/tests/kanban-colors.test.ts
      - run: pnpm exec turbo run build --filter='web^...'
      - run: pnpm --filter web check:types
      - run: pnpm --filter web build
  images:
    needs: [resolve, backend-test, web-test]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        run: |
          echo "backend=$(node -p 'require("./hentis/upstream.json").backend_image')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.component == 'backend' && 'hentis/Dockerfile.backend' || 'apps/web/Dockerfile.web' }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/hantking/plane-custom-${{ matrix.component }}:sha-${{ steps.source.outputs.sha }}
          build-args: UPSTREAM_BACKEND=${{ steps.meta.outputs.backend }}
          labels: |
            org.opencontainers.image.source=https://github.com/Hantking/plane-custom
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=hentis-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=hentis-${{ matrix.component }}
      - name: Record immutable image
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python -c 'import json,os,pathlib; pathlib.Path(os.environ["COMPONENT"]+".json").write_text(json.dumps({os.environ["COMPONENT"]:"ghcr.io/hantking/plane-custom-"+os.environ["COMPONENT"]+"@"+os.environ["DIGEST"]}))'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.json
  release:
    needs: images
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Publish tested build manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json,pathlib,subprocess; p=pathlib.Path; upstream=json.loads(p("hentis/upstream.json").read_text()); images={**json.loads(p("backend.json").read_text()),**json.loads(p("frontend.json").read_text())}; sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); p("custom-release.json").write_text(json.dumps({"schema":1,"upstream_tag":upstream["tag"],"upstream_commit":upstream["commit"],"source_commit":sha,"platform":"linux/arm64","images":images},indent=2))'
          tag="hentis-$(git rev-parse HEAD)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then exit 0; fi
          gh release create "$tag" custom-release.json --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Hentis custom fields $(git rev-parse --short HEAD)" --notes 'Backend integration tests, frontend typecheck and build passed. Images: ARM64. Inspect custom-release.json for immutable digests.'
